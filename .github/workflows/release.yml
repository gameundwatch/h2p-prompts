name: release

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag is the single source of truth for the version.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the h2p skill
        run: |
          test -f h2p/SKILL.md  # refuse to publish an empty/broken skill
          zip -r h2p.zip h2p -x '*/.DS_Store'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" h2p.zip --generate-notes
